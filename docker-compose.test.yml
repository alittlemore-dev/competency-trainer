services:
  postgres-test:
    image: postgres:18.4-alpine
    container_name: competency_trainer_postgres_test
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-competency_trainer_database_test}
    ports:
      - "${DB_PORT:-55432}:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-competency_trainer_database_test}"]
      interval: 2s
      timeout: 10s
      retries: 30

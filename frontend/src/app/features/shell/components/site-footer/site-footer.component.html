<footer class="container border-top pt-3 pb-3">
  <div
    class="d-flex flex-column flex-md-row gap-3 justify-content-between align-items-start"
    data-testid="site-footer-layout"
  >
    <ul class="nav list-inline flex-wrap gap-2" data-testid="site-footer-links">
      <li class="nav-item me-2">
        <a href="/api/docs" class="nav-link p-0 text-body-secondary">
          <small>{{ 'shell.footer.docs' | t }}</small>
        </a>
      </li>
      <li class="nav-item me-2" aria-hidden="true">|</li>
      <li class="nav-item me-2">
        <a
          href="https://github.com/alittlemore-dev/competency-trainer"
          target="_blank"
          rel="noopener noreferrer"
          class="nav-link p-0 text-body-secondary"
        >
          <small>{{ 'shell.footer.sourceCode' | t }}</small>
        </a>
      </li>
      <li class="nav-item me-2" aria-hidden="true">|</li>
      <li class="nav-item me-2">
        <a [routerLink]="siteBuildLink()" class="nav-link p-0 text-body-secondary">
          <small>{{ 'shell.footer.siteBuild' | t }}</small>
        </a>
      </li>
      <li class="nav-item me-2" aria-hidden="true">|</li>
      <li class="nav-item me-2">
        <a [routerLink]="updatesLink()" class="nav-link p-0 text-body-secondary">
          <small>{{ 'shell.footer.updates' | t }}</small>
        </a>
      </li>
      <li class="nav-item me-2" aria-hidden="true">|</li>
      <li class="nav-item">
        <a routerLink="/sitemap" class="nav-link p-0 text-body-secondary">
          <small>{{ 'shell.footer.sitemap' | t }}</small>
        </a>
      </li>
    </ul>

    <ul
      class="nav list-unstyled d-flex flex-wrap justify-content-start justify-content-md-end gap-3"
      data-testid="site-footer-social"
    >
      <li>
        <a
          href="https://github.com/ALittleMoron"
          target="_blank"
          rel="noopener noreferrer"
          [attr.aria-label]="'shell.footer.githubProfile' | t"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"
            ></path>
            <path d="M9 18c-4.51 2-5-2-7-2"></path>
          </svg>
        </a>
      </li>
      <li>
        <a href="mailto:d.lunev.dev@gmail.com" [attr.aria-label]="'shell.footer.email' | t">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect width="20" height="16" x="2" y="4" rx="2"></rect>
            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
          </svg>
        </a>
      </li>
      <li>
        <a
          href="https://t.me/alm_dmitriy_dev"
          target="_blank"
          rel="noopener noreferrer"
          [attr.aria-label]="'shell.footer.telegramProfile' | t"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            fill="currentColor"
            class="bi bi-telegram"
            viewBox="0 0 16 16"
          >
            <path
              d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0M8.287 5.906q-1.168.486-4.666 2.01-.567.225-.595.442c-.03.243.275.339.69.47l.175.055c.408.133.958.288 1.243.294q.39.01.868-.32 3.269-2.206 3.374-2.23c.05-.012.12-.026.166.016s.042.12.037.141c-.03.129-1.227 1.241-1.846 1.817-.193.18-.33.307-.358.336a8 8 0 0 1-.188.186c-.38.366-.664.64.015 1.088.327.216.589.393.85.571.284.194.568.387.936.629q.14.092.27.187c.331.236.63.448.997.414.214-.02.435-.22.547-.82.265-1.417.786-4.486.906-5.751a1.4 1.4 0 0 0-.013-.315.34.34 0 0 0-.114-.217.53.53 0 0 0-.31-.093c-.3.005-.763.166-2.984 1.09"
            />
          </svg>
        </a>
      </li>
      <li>
        <a
          href="https://www.linkedin.com/in/dmitriy-lunev/"
          target="_blank"
          rel="noopener noreferrer"
          [attr.aria-label]="'shell.footer.linkedinProfile' | t"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"
            ></path>
            <rect width="4" height="12" x="2" y="9"></rect>
            <circle cx="4" cy="4" r="2"></circle>
          </svg>
        </a>
      </li>
    </ul>
  </div>
</footer>
